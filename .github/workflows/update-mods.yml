name: Update mod locks

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Run update.py
        run: nix shell nixpkgs#python3Packages.requests -c python3 ./update.py

      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update mod locks"
          title: "Update mod locks"
          body: |
            Automated run of `./update.py` against the Modrinth API.

            Review the diff in `mods/` before merging — a mod jumping to a new
            version here changes what `modrinthMods.<loader>.latest.<name>` and
            `modrinthMods.<loader>."<gameVersion>".<name>` resolve to for every
            consumer of this flake.
          branch: automated/update-mods
          add-paths: mods/**
          delete-branch: true
